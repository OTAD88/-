name: Build Jesr Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/jesr-apk-build

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: TypeScript validation
        run: pnpm check

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Verify Jesr native module autolinking
        run: |
          if ! grep -R -q "jesr-network" android/settings.gradle android/build.gradle android/app/build.gradle android/jesr-network 2>/dev/null; then
            echo "Jesr native module was not autolinked"
            exit 1
          fi
          if ! grep -R -q "JesrNetworkModule" android 2>/dev/null; then
            echo "JesrNetworkModule class was not included in the generated Android project"
            exit 1
          fi

      - name: Build release APK (arm64-v8a)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" Jesr-1.8.0.apk
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose Jesr-1.8.0.apk
          "$BT/aapt2" dump badging Jesr-1.8.0.apk | tee badging.txt
          grep -q "versionName='1.8.0'" badging.txt
          unzip -l Jesr-1.8.0.apk > apk-files.txt
          grep -q "lib/arm64-v8a/" apk-files.txt
          ! grep -q "lib/armeabi-v7a/" apk-files.txt
          sha256sum Jesr-1.8.0.apk
          ls -lh Jesr-1.8.0.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Jesr-1.8.0-Android-APK
          path: Jesr-1.8.0.apk
          if-no-files-found: error
