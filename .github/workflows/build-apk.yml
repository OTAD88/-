name: Build Jesr Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/jesr-apk-build
      - release/jesr-2.9

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: TypeScript validation
        run: pnpm check

      - name: ESLint validation
        run: pnpm lint

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Verify Jesr native module autolinking
        run: |
          npx expo-modules-autolinking resolve --platform android > autolinking.json
          grep -q "jesr-network" autolinking.json
          grep -q "JesrNetworkModule" autolinking.json

      - name: Build release APK (arm64-v8a)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" 'جسر-2.9.apk'
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose 'جسر-2.9.apk'
          "$BT/aapt2" dump badging 'جسر-2.9.apk' | tee badging.txt
          grep -q "versionName='2.9'" badging.txt
          grep -q "versionCode='29'" badging.txt
          grep -q "application-label:'جسر'" badging.txt
          unzip -l 'جسر-2.9.apk' > apk-files.txt
          grep -q "lib/arm64-v8a/" apk-files.txt
          grep -q "lib/arm64-v8a/libsodium.so" apk-files.txt
          ! grep -q "lib/armeabi-v7a/" apk-files.txt
          sha256sum 'جسر-2.9.apk' | tee apk-sha256.txt
          ls -lh 'جسر-2.9.apk'

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: جسر-2.9-Android-APK
          path: |
            جسر-2.9.apk
            apk-sha256.txt
          if-no-files-found: error
