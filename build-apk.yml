name: Build Jesr APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check (core app code; informational)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Confirm native module was autolinked
        run: |
          grep -rn "jesr-network" android/settings.gradle android/app/build/generated 2>/dev/null | head -3 || true
          grep -q "jesr-network" android/settings.gradle || grep -rq "jesr-network" android/ || { echo "jesr-network not linked"; exit 1; }

      - name: Build release APK (arm64-v8a)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp "$APK" Jesr-1.8.0.apk
          "$BT/apksigner" verify --verbose Jesr-1.8.0.apk
          "$BT/aapt2" dump badging Jesr-1.8.0.apk | tee badging.txt | head -5
          grep -q "versionName='1.8.0'" badging.txt
          CODE=$(grep -o "versionCode='[0-9]*'" badging.txt | grep -o "[0-9]*")
          [ "$CODE" -ge 8 ]
          unzip -l Jesr-1.8.0.apk > files.txt
          grep -q "lib/arm64-v8a/libsodium.so" files.txt
          grep -q "lib/arm64-v8a/libjnidispatch.so" files.txt
          ! grep -q "lib/armeabi-v7a/" files.txt
          ls -l Jesr-1.8.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jesr-1.8.0-apk
          path: Jesr-1.8.0.apk
